<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Settle up · Divvy</title>

<!-- These links are private by nature (see the fragment note in the script below) and there is
     nothing at this URL without one, so keep it out of search results entirely. -->
<meta name="robots" content="noindex, nofollow">

<!-- Link previews are generated from static HTML by iMessage/SMS/Slack — they never execute the
     page's JS, so a preview can only ever show this generic card, never the amounts. That's the
     desired outcome: the split shouldn't be readable from a chat list. -->
<meta property="og:title" content="Settle up on Divvy">
<meta property="og:description" content="See what you owe and pay it back in a tap.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="icon" href="/images/Icons/Divvy_Icon.png">

<style>
/* Design tokens lifted from the Divvy app itself so this page reads as the same product:
   mainBackground / cellBackground from Assets.xcassets, the 25pt corner radius that dominates
   the app's cards (21 uses in Main UI), SF Pro Rounded (`.fontDesign(.rounded)`, 27 uses), and
   monospaced bold for money the way ShareView renders balances. */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    /* Assets.xcassets/mainBackground + cellBackground */
    --background: #F1F2F6;
    --card: #FFFFFF;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --divider: rgba(0, 0, 0, 0.07);
    --row-active: rgba(0, 0, 0, 0.035);
    --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.10);

    /* Divvy's named colors */
    --divvy-red: #E08D79;
    --divvy-gold: #E3B86E;
    --divvy-green: #0A5B48;

    /* The default trio from [Color].gradientColors — used when there's no real payer color to
       work with. Blue / green / red, exactly as the app falls back to. */
    --mesh-blue: #6C95B7;
    --mesh-green: #B9EED2;
    --mesh-red: #EF8470;
    --mesh-alpha: 0.85;

    /* What `.mesh` actually paints with — defaults to the fallback trio above, but `applyHeaderMesh()`
       overrides these three (not --mesh-blue/green/red directly) with real payer colors when the
       payload has any, so the bubble fallback trio and the header background stay independent. */
    --header-mesh-1: var(--mesh-blue);
    --header-mesh-2: var(--mesh-red);
    --header-mesh-3: var(--mesh-green);

    --venmo: #008CFF;
    --cashapp: #00C244;
    --applecash: #1d1d1f;

    --radius-card: 25px;
    --font-rounded: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    /* The pay buttons stay on the standard system face — the rounded face fights the Venmo and
       Cash App wordmarks, which aren't rounded. */
    --font-system: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
    :root {
        --background: #000000;
        --card: #1C1C1E;
        --text-primary: #f5f5f7;
        --text-secondary: #8e8e93;
        --divider: rgba(255, 255, 255, 0.10);
        --row-active: rgba(255, 255, 255, 0.05);
        --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        --divvy-gold: #F0C884;
        --divvy-green: #6FB58E;
        --applecash: #f5f5f7;
        /* The mesh sits over pure black in dark mode, so it's pulled back to a glow. */
        --mesh-alpha: 0.5;
    }
}

html { background-color: var(--background); -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-rounded);
    background-color: var(--background);
    color: var(--text-primary);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 30px 18px calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    min-height: 100svh;
}

/* A CSS approximation of the app's MetalMeshGradientBalanced header: a ~320px band of soft
   colour blobs at the top, fading into mainBackground. Not the real mesh shader — three blurred
   radial gradients that drift slowly, which reads the same at a glance. */
.mesh {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 320px;
    pointer-events: none;
    z-index: 0;
    opacity: var(--mesh-alpha);
    background:
        radial-gradient(58% 68% at 18% 18%, var(--header-mesh-1) 0%, transparent 62%),
        radial-gradient(62% 70% at 84% 12%, var(--header-mesh-2) 0%, transparent 62%),
        radial-gradient(72% 78% at 48% 72%, var(--header-mesh-3) 0%, transparent 68%);
    filter: blur(34px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
    animation: drift 18s ease-in-out infinite alternate;
}

@keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1.05); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.12); }
}

@media (prefers-reduced-motion: reduce) {
    .mesh { animation: none; }
}

.sheet { width: 100%; max-width: 520px; position: relative; z-index: 1; }

/* ---------- Header ---------- */

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 26px;
}

.brand img { width: 30px; height: 30px; border-radius: 22%; display: block; }

.brand span { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }

.headline { margin-bottom: 22px; }

.headline h1 {
    font-size: 32px;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
}

.headline p {
    margin-top: 5px;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 500;
}

/* ---------- People list ---------- */

.section-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    margin: 0 0 9px 4px;
}

.people {
    list-style: none;
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
}

.person + .person { border-top: 1px solid var(--divider); }

.person-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 18px;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.person-row:hover { background: var(--row-active); }
.person-row:focus-visible { outline: 2px solid var(--mesh-blue); outline-offset: -3px; }

/* The app's ProfileBubble: a circle filled topLeading->bottomTrailing with two of the palette
   colours, initials in 90% white at heavy weight. */
.bubble {
    width: 44px; height: 44px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
}

/* ShareView's balanceCard row: name (bold) stacked tight over a status caption, with the pair
   noticeably shorter than the bubble beside them — that ratio is the whole point of this block,
   so `line-height` is pulled in from `body`'s 1.45 (meant for prose, not a 2-line label stack)
   rather than left to inherit it. */
.person-text { flex: 1; min-width: 0; }

.person-name {
    display: block;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.15;
    overflow-wrap: anywhere;
}

.person-status {
    display: block;
    font-size: 13px;
    line-height: 1.15;
    color: var(--text-secondary);
    margin-top: 1px;
}

.chev {
    width: 12px; height: 12px;
    flex: none;
    border-right: 2.5px solid var(--text-secondary);
    border-bottom: 2.5px solid var(--text-secondary);
    border-radius: 0 0 2px 0;
    transform: rotate(-45deg) translate(-1px, 1px);
}

.payer + .payer { margin-top: 16px; }

.payer-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 9px;
}

.pay-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

.pay-btn {
    flex: 1 1 auto;
    min-width: 110px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 16px;
    border-radius: 18px;
    font-family: var(--font-system);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: #ffffff;
    background: var(--text-secondary);
    transition: opacity 0.15s ease, transform 0.15s ease;
}

.pay-btn:active { opacity: 0.8; transform: scale(0.98); }
.pay-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.85); flex: none; }

.pay-btn.venmo { background: var(--venmo); }
.pay-btn.cashapp { background: var(--cashapp); }
.pay-btn.applecash { background: var(--applecash); color: var(--card); }
.pay-btn.applecash .dot { background: var(--card); opacity: 0.8; }

.pay-note { margin-top: 9px; font-size: 13px; color: var(--text-secondary); }

.handle-only { font-size: 15px; color: var(--text-secondary); }

/* ---------- Money ---------- */

/* Ports CurrencyLabel's look: the app draws "$" at ambient (smaller) size, the dollar amount at
   `.title`, and the cents as a same-digit-count string forced to shrink into a single character's
   width via minimumScaleFactor, top-aligned — which reads as a small raised "cents" mark with no
   decimal point. Font-size on each part is set in `em` so `.person-money`/`.detail-money` can
   just change one font-size and have every part scale together. */
/* Flex, not `vertical-align` — a baseline-aligned small "$" reads as sitting low against the much
   taller dollar digits. `align-items: center` on the row plus a per-part `align-self` gives each
   piece exactly the vertical position it needs: the sign centered on the dollars' full height, the
   cents pinned to the top for the raised, no-decimal-point look. */
.money {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
}

.money-sign { font-size: 0.6em; margin-right: 1px; align-self: center; }
.money-dollars { font-size: 1em; line-height: 1; }

.money-cents {
    font-size: 0.52em;
    line-height: 1;
    align-self: flex-start;
    margin-left: 1px;
    margin-top: 0.05em;
}

.person-money { flex: none; font-size: 22px; }

/* ---------- Person detail (full screen) ---------- */

.detail {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: var(--background);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
}

.detail.open { transform: translateX(0); }
.detail[hidden] { display: none; }

.detail-header {
    display: flex;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
}

.detail-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    flex: none;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--card-shadow);
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.detail-back::before {
    content: '';
    width: 8px; height: 8px;
    border-left: 2.5px solid var(--text-primary);
    border-bottom: 2.5px solid var(--text-primary);
    transform: rotate(45deg) translate(1px, -1px);
}

.detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 24px calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Wraps just the bubble/name/status trio, kept separate from the money/pay-buttons spacing
   further down. Per ShareView's balanceCard: the bubble reads as clearly bigger than the
   name+status pair beside it, and name sits right on top of status — so the bubble->name gap and
   the name->status gap are deliberately different, not one uniform value. */
.detail-identity {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.detail-bubble {
    width: 88px; height: 88px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
    box-shadow: var(--card-shadow);
    margin-bottom: 10px;
}

.detail-name { font-size: 24px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.detail-status { font-size: 15px; line-height: 1.15; color: var(--text-secondary); margin-top: 2px; }
.detail-money { font-size: 46px; margin: 18px 0 28px; }

.detail-pay { width: 100%; max-width: 380px; text-align: left; }

/* ---------- Footer / states ---------- */

.foot {
    margin-top: 24px;
    padding: 0 6px;
    font-size: 13px;
    color: var(--text-secondary);
}

.foot a { color: inherit; }

.state {
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 30px 24px;
    text-align: center;
}

.state h2 { font-size: 19px; font-weight: 700; margin-bottom: 7px; }
.state p { font-size: 15px; color: var(--text-secondary); }

.settled { font-size: 34px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="mesh" aria-hidden="true"></div>

<main class="sheet">
    <div class="brand">
        <img src="/images/Icons/Divvy_Icon.png" alt="">
        <span>Divvy</span>
    </div>

    <div class="headline">
        <h1 id="title">Settle up</h1>
        <p id="subtitle"></p>
    </div>

    <div id="content"></div>

    <p class="foot" id="foot">
        Split with <a href="https://divvy.mgcf1.com">Divvy</a>. Everything on this page came out of
        the link itself — nothing was sent to a server.
    </p>
</main>

<!-- Populated per-person by openDetail() in the script below; the header/back button are the
     only static part, so they're written out once here rather than rebuilt every time. -->
<div class="detail" id="detail" hidden>
    <div class="detail-header">
        <button type="button" class="detail-back" id="detailBack" aria-label="Back"></button>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* Highest payload version this page knows how to render. The scheme doc reserves `v` for
       exactly this: a newer app can ship a new shape and old pages will say so plainly instead
       of rendering something half-wrong. */
    var SUPPORTED_VERSION = 1;

    /* Sanity ceilings. A hand-edited or corrupted link shouldn't be able to make the page build
       ten thousand DOM nodes. */
    var MAX_PEOPLE = 200;
    var MAX_PAYERS = 20;

    var titleEl = document.getElementById('title');
    var subtitleEl = document.getElementById('subtitle');
    var contentEl = document.getElementById('content');
    var detailEl = document.getElementById('detail');

    // ---------- helpers ----------

    /* Every string in the payload is attacker-controllable — the whole payload is just whatever
       is after the `#`. So payload text only ever reaches the DOM through textContent, never
       innerHTML, and this helper is the only way this file builds an element. */
    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text !== undefined && text !== null) { node.textContent = String(text); }
        return node;
    }

    function money(cents) {
        return (cents / 100).toLocaleString('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    /* DOM version of CurrencyLabel's look (see the `.money` rule): "$" and the cents both render
       smaller than the dollar amount, and the cents sit raised with no decimal point. All amounts
       on this page are non-negative (people[].o is always positive), so there's no sign to handle. */
    function moneyEl(cents, extraClass) {
        var dollars = Math.floor(cents / 100).toLocaleString('en-US');
        var centsStr = String(cents % 100).padStart(2, '0');
        var wrap = el('span', extraClass ? 'money ' + extraClass : 'money');
        wrap.appendChild(el('span', 'money-sign', '$'));
        wrap.appendChild(el('span', 'money-dollars', dollars));
        wrap.appendChild(el('span', 'money-cents', centsStr));
        return wrap;
    }

    function dollarsForURL(cents) {
        return (cents / 100).toFixed(2);
    }

    /* The app's default palette for a group with no profile colours — [Color].gradientColors
       falls back to exactly these three. Positional fallback for people whose real color didn't
       make it through (an old link from before `c` existed, or a hand-edited/malformed value). */
    var MESH = ['var(--mesh-blue)', 'var(--mesh-green)', 'var(--mesh-red)'];

    /* ProfileBubble fills topLeading -> bottomTrailing with [secondary, primary]; 135deg is the
       CSS equivalent of that corner-to-corner direction. */
    function bubbleGradient(index) {
        var primary = MESH[index % MESH.length];
        var secondary = MESH[(index + 1) % MESH.length];
        return 'linear-gradient(135deg, ' + secondary + ' 0%, ' + primary + ' 100%)';
    }

    /* Lightens (positive) or darkens (negative) a #RRGGBB by `percent`. */
    function shadeColor(hex, percent) {
        var num = parseInt(hex.slice(1), 16);
        var amt = Math.round(2.55 * percent);
        var r = Math.min(255, Math.max(0, (num >> 16) + amt));
        var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
        var b = Math.min(255, Math.max(0, (num & 0xff) + amt));
        return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
    }

    /* The real per-profile bubble: a lighter and darker shade of the one color the payload
       carries, standing in for the app's independently-random secondary color — same
       topLeading->bottomTrailing direction as `bubbleGradient`. Falls back to the positional
       palette when there's no real color. */
    function personBubbleGradient(person, index) {
        if (!person.color) { return bubbleGradient(index); }
        var lighter = shadeColor(person.color, 22);
        var darker = shadeColor(person.color, -12);
        return 'linear-gradient(135deg, ' + lighter + ' 0%, ' + darker + ' 100%)';
    }

    /* Overrides --header-mesh-1/2/3 (see :root) with real payer colors, cycling through what's
       available so 1-2 payers still light up all three blobs instead of leaving some on the
       default fallback trio. Explicitly clears the overrides when there's nothing to use —
       without that, a second link pasted into the same tab (hashchange) that has no payer colors
       would keep showing the previous link's. */
    function applyHeaderMesh(payers) {
        var root = document.documentElement.style;
        var colors = payers.map(function (p) { return p.color; }).filter(Boolean);
        if (!colors.length) {
            root.removeProperty('--header-mesh-1');
            root.removeProperty('--header-mesh-2');
            root.removeProperty('--header-mesh-3');
            return;
        }
        root.setProperty('--header-mesh-1', colors[0]);
        root.setProperty('--header-mesh-2', colors[1] || colors[0]);
        root.setProperty('--header-mesh-3', colors[2] || colors[1] || colors[0]);
    }

    function initials(name) {
        var parts = name.trim().split(/\s+/).slice(0, 2);
        var letters = parts.map(function (part) {
            return Array.from(part)[0] || '';
        }).join('');
        return letters.toUpperCase() || '?';
    }

    /* Handles go straight into a URL path/query, so they're restricted to the characters Venmo
       and Cash App actually allow. Anything else is treated as "not set" rather than escaped and
       passed along — a handle that needs escaping is a handle that isn't going to work anyway. */
    function cleanHandle(value) {
        if (typeof value !== 'string') { return null; }
        var handle = value.trim().replace(/^[@$]+/, '');
        return /^[A-Za-z0-9_.-]{1,64}$/.test(handle) ? handle : null;
    }

    function cleanPhone(value) {
        if (typeof value !== 'string') { return null; }
        var phone = value.replace(/[^\d+]/g, '');
        return /^\+?\d{7,15}$/.test(phone) ? phone : null;
    }

    /* Strict #RRGGBB — this goes straight into a CSS gradient, so anything looser than an exact
       6-digit hex is treated as absent (falls back to the positional MESH palette) rather than
       passed through. */
    function cleanColor(value) {
        if (typeof value !== 'string') { return null; }
        return /^#[0-9A-Fa-f]{6}$/.test(value) ? value : null;
    }

    function cleanName(value, fallback) {
        if (typeof value !== 'string') { return fallback; }
        var name = value.trim();
        return name.length ? name.slice(0, 60) : fallback;
    }

    function isCents(value) {
        return typeof value === 'number' && isFinite(value) && value >= 0 && Math.floor(value) === value;
    }

    // ---------- decode ----------

    /* Base64URL → JSON. The payload lives in the fragment specifically because a fragment is
       never transmitted in the HTTP request: the handles, phone numbers and amounts below never
       reach this server or its access logs, and never would even if the hosting changed. */
    function decode(hash) {
        var raw = hash.replace(/^#/, '').trim();
        if (!raw) { return null; }
        var padded = raw.replace(/-/g, '+').replace(/_/g, '/');
        padded += '='.repeat((4 - padded.length % 4) % 4);
        var binary = atob(padded);
        /* atob yields one byte per char; the payload is UTF-8, so names with accents or emoji
           have to be decoded rather than read as Latin-1. */
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
        var json = new TextDecoder('utf-8').decode(bytes);
        return JSON.parse(json);
    }

    function normalize(payload) {
        if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
            throw new Error('malformed');
        }
        if (payload.v !== SUPPORTED_VERSION) {
            var err = new Error('version');
            err.code = 'version';
            throw err;
        }

        var payers = (Array.isArray(payload.payers) ? payload.payers : [])
            .slice(0, MAX_PAYERS)
            .map(function (payer, index) {
                payer = payer && typeof payer === 'object' ? payer : {};
                return {
                    name: cleanName(payer.n, 'Someone'),
                    venmo: cleanHandle(payer.ve),
                    cashApp: cleanHandle(payer.ca),
                    applePay: payer.ap === true,
                    phone: cleanPhone(payer.ph),
                    color: cleanColor(payer.c),
                    key: index
                };
            });

        var people = (Array.isArray(payload.people) ? payload.people : [])
            .slice(0, MAX_PEOPLE)
            .filter(function (person) {
                return person && typeof person === 'object' && isCents(person.o);
            })
            .map(function (person) {
                return { name: cleanName(person.n, 'Someone'), owes: person.o, color: cleanColor(person.c) };
            });

        return {
            title: cleanName(payload.t, null),
            total: isCents(payload.total) ? payload.total : null,
            payers: payers,
            people: people
        };
    }

    // ---------- payment links ----------

    function noteText(data) {
        return data.title ? data.title : 'Divvy split';
    }

    /* Venmo's own web-to-app handoff re-serializes the query string as form-urlencoded on the
       way to the venmo:// scheme, which turns every space into a literal "+" that the app then
       shows inside the note field. It does that whether the space arrives as %20 or as +, so no
       encoding of a plain space survives the trip. A non-breaking space is left alone by that
       re-encoding and is visually identical in the note, so the note reads as written.
       Verified against the live redirect chain: %20 and + both emerge as "+", while %C2%A0
       comes through intact. */
    function venmoNote(note) {
        return note.replace(/ /g, '\u00A0');
    }

    function venmoURL(payer, cents, note) {
        return 'https://venmo.com/' + encodeURIComponent(payer.venmo) +
            '?txn=pay&amount=' + dollarsForURL(cents) +
            '&note=' + encodeURIComponent(venmoNote(note));
    }

    function cashAppURL(payer, cents) {
        /* cash.app/$cashtag/AMOUNT is Cash App's own prefill format — it opens the app on a
           phone and the web payment page on a desktop, so one href covers both. */
        return 'https://cash.app/$' + encodeURIComponent(payer.cashApp) + '/' + dollarsForURL(cents);
    }

    function appleCashURL(payer, cents, note) {
        /* Apple Cash has no public payment URL and no way to prefill an amount — payments happen
           inside Messages. The best this page can do is open a message to the payer with the
           amount written out, which is also why the scheme carries `ph` only when `ap` is true.
           The `?&body=` form is the one that works on both iOS and Android. */
        var body = 'Sending you ' + money(cents) + ' for ' + note + ' via Apple Cash';
        return 'sms:' + payer.phone + '?&body=' + encodeURIComponent(body);
    }

    function payButtons(payer, cents, note) {
        var wrap = el('div', 'pay-buttons');
        var added = 0;

        function add(className, label, href) {
            var link = el('a', 'pay-btn ' + className);
            link.href = href;
            link.rel = 'noopener noreferrer';
            link.appendChild(el('span', 'dot'));
            link.appendChild(el('span', null, label));
            wrap.appendChild(link);
            added++;
        }

        if (payer.venmo) { add('venmo', 'Venmo', venmoURL(payer, cents, note)); }
        if (payer.cashApp) { add('cashapp', 'Cash App', cashAppURL(payer, cents)); }
        if (payer.applePay && payer.phone) { add('applecash', 'Apple Cash', appleCashURL(payer, cents, note)); }

        return added ? wrap : null;
    }

    /* Builds the payer sections shared by the detail view (and, before it existed, the inline
       panel this replaced) — one per payer, either their pay buttons or a "no payment method"
       note, plus a closing note when there's more than one payer to choose from. */
    function buildPaySections(person, data, note) {
        var frag = document.createDocumentFragment();

        data.payers.forEach(function (payer) {
            var group = el('div', 'payer');
            group.appendChild(el('p', 'payer-label', 'Pay ' + payer.name));
            var buttons = payButtons(payer, person.owes, note);
            if (buttons) {
                group.appendChild(buttons);
            } else {
                group.appendChild(el('p', 'handle-only',
                    payer.name + ' hasn’t added a payment method — ask them how they’d like to be paid.'));
            }
            frag.appendChild(group);
        });

        if (data.payers.length > 1) {
            frag.appendChild(el('p', 'pay-note',
                'Pay whichever is easiest — send the whole ' + money(person.owes) + ' to one of them, then tell the others.'));
        }

        return frag;
    }

    // ---------- person detail (full screen) ----------

    function openDetail(person, index, data, note) {
        var stale = detailEl.querySelector('.detail-body');
        if (stale) { stale.remove(); }

        var body = el('div', 'detail-body');

        var identity = el('div', 'detail-identity');
        var bubble = el('div', 'detail-bubble', initials(person.name));
        bubble.style.backgroundImage = personBubbleGradient(person, index);
        identity.appendChild(bubble);
        identity.appendChild(el('div', 'detail-name', person.name));
        identity.appendChild(el('div', 'detail-status', 'owes'));
        body.appendChild(identity);

        body.appendChild(moneyEl(person.owes, 'detail-money'));

        var pay = el('div', 'detail-pay');
        pay.appendChild(buildPaySections(person, data, note));
        body.appendChild(pay);

        detailEl.appendChild(body);
        detailEl.hidden = false;
        /* Forces a layout flush between un-hiding (still at the off-screen transform) and adding
           `.open` — without it the browser can collapse both changes into one frame and skip the
           slide-in transition entirely. */
        void detailEl.offsetWidth;
        detailEl.classList.add('open');
    }

    function closeDetail() {
        detailEl.classList.remove('open');
        window.setTimeout(function () {
            if (!detailEl.classList.contains('open')) { detailEl.hidden = true; }
        }, 320);
    }

    document.getElementById('detailBack').addEventListener('click', closeDetail);

    // ---------- render ----------

    function renderPerson(person, index, data, note) {
        var item = el('li', 'person');

        var row = el('button', 'person-row');
        row.type = 'button';

        var bubble = el('span', 'bubble', initials(person.name));
        bubble.style.backgroundImage = personBubbleGradient(person, index);
        row.appendChild(bubble);

        /* ShareView stacks a bold name over a caption-sized "owes"/"is owed" line — same shape
           here, minus the "is owed" case, since everyone on this page owes the payer. */
        var text = el('span', 'person-text');
        text.appendChild(el('span', 'person-name', person.name));
        text.appendChild(el('span', 'person-status', 'owes'));
        row.appendChild(text);

        row.appendChild(moneyEl(person.owes, 'person-money'));
        row.appendChild(el('span', 'chev'));

        row.addEventListener('click', function () {
            openDetail(person, index, data, note);
        });

        item.appendChild(row);
        return item;
    }

    function renderState(heading, detail, glyph) {
        var box = el('div', 'state');
        if (glyph) { box.appendChild(el('div', 'settled', glyph)); }
        box.appendChild(el('h2', null, heading));
        box.appendChild(el('p', null, detail));
        contentEl.appendChild(box);
    }

    function render(data) {
        titleEl.textContent = data.title || 'Settle up';
        applyHeaderMesh(data.payers);

        var bits = [];
        if (data.total !== null) { bits.push(money(data.total) + ' total'); }
        if (data.people.length) {
            bits.push(data.people.length + (data.people.length === 1 ? ' person owes' : ' people owe'));
        }
        subtitleEl.textContent = bits.join(' · ');

        if (!data.people.length) {
            renderState('All settled up', 'Nobody owes anything on this one.', '✓');
            return;
        }

        if (!data.payers.length) {
            renderState('This link is incomplete',
                'It doesn’t say who to pay. Ask whoever sent it to share it again from Divvy.');
            return;
        }

        contentEl.appendChild(el('p', 'section-label',
            data.people.length === 1 ? 'Amount owed' : 'Who owes what'));

        var list = el('ul', 'people');
        var note = noteText(data);
        data.people.forEach(function (person, index) {
            list.appendChild(renderPerson(person, index, data, note));
        });
        contentEl.appendChild(list);

        /* A link sent one-to-one has nothing to choose between, so skip straight to the detail
           view instead of making them tap the one row. */
        if (data.people.length === 1) {
            openDetail(data.people[0], 0, data, note);
        }
    }

    // ---------- boot ----------

    function boot() {
        contentEl.textContent = '';
        /* A second link can land in the same tab via hashchange — don't leave the previous
           link's detail view showing over the newly-decoded content. */
        detailEl.hidden = true;
        detailEl.classList.remove('open');

        var payload;
        try {
            payload = decode(window.location.hash);
        } catch (error) {
            renderState('This link is damaged',
                'It couldn’t be read. Ask whoever sent it to share it again from Divvy.');
            return;
        }

        if (payload === null) {
            titleEl.textContent = 'Settle up';
            renderState('Nothing to show yet',
                'This page needs a share link from the Divvy app to know who owes what.');
            return;
        }

        try {
            render(normalize(payload));
        } catch (error) {
            if (error && error.code === 'version') {
                renderState('This link needs a newer version',
                    'It was created by a newer version of Divvy than this page understands.');
            } else {
                renderState('This link is damaged',
                    'It couldn’t be read. Ask whoever sent it to share it again from Divvy.');
            }
        }
    }

    boot();
    /* Share sheets and in-app browsers sometimes hand over a URL whose fragment lands a beat
       later, and a person can paste a second link into the same tab — both arrive as hashchange
       rather than a fresh load. */
    window.addEventListener('hashchange', boot);
})();
</script>

</body>
</html>
