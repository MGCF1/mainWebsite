<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Safe Area Test</title>
    <style>
        :root {
            --fg: #38bdf8;
            --fg2: #f97316;
            --bg-image: url("images/Highlights/WWDC25.png");
            --bg-position: center;
            --bg-size: cover;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            background: transparent;
        }

        html.bg-html {
            background-image: var(--bg-image);
            background-position: var(--bg-position);
            background-size: var(--bg-size);
            background-repeat: no-repeat;
        }

        html.bg-html-before::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background-image: var(--bg-image);
            background-position: var(--bg-position);
            background-size: var(--bg-size);
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100lvh;
            background: transparent;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            position: relative;
            isolation: isolate;
        }

        body.bg-body-before::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: calc(-1 * var(--safe-top));
            bottom: calc(-1 * var(--safe-bottom));
            background-image: var(--bg-image);
            background-position: var(--bg-position);
            background-size: var(--bg-size);
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none;
            transform: translateZ(0);
        }

        .safe-guides {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 3;
        }

        .safe-guides::before,
        .safe-guides::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: var(--safe-top);
            border-top: 2px solid rgba(255, 255, 255, 0.35);
        }

        .safe-guides::after {
            top: auto;
            bottom: 0;
            height: var(--safe-bottom);
            border-top: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.35);
        }

        .safe-labels {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(var(--safe-bottom) + 12px);
            font-size: 12px;
            opacity: 0.8;
            pointer-events: none;
            z-index: 3;
        }

        .stack {
            position: relative;
            padding: 24px;
            padding-bottom: calc(var(--safe-bottom) + 24px);
            background: transparent;
            z-index: 1;
        }

        .card {
            height: 60vh;
            margin: 16px 0;
            border-radius: 18px;
            background: var(--fg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .card.alt {
            background: var(--fg2);
        }

        .card-title {
            padding: 16px 18px;
            font-weight: 600;
        }

        .header {
            position: sticky;
            top: 0;
            padding: 12px 16px 16px;
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 5;
        }

        .mode-toggle {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .mode-toggle button {
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(15, 23, 42, 0.4);
            color: white;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
        }

        .mode-toggle button.is-active {
            background: white;
            color: #0f172a;
            border-color: white;
        }

        .footer-bar {
            position: sticky;
            bottom: 0;
            margin-top: 24px;
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>

<body class="bg-body-before">
    <div class="safe-guides"></div>
    <div class="header">
        Safe Area Test: scroll to see cards extend under Safari UI
        <div class="mode-toggle" role="group" aria-label="Background mode">
            <button type="button" data-mode="body-before" class="is-active">Body ::before (fixed)</button>
            <button type="button" data-mode="html">HTML background</button>
            <button type="button" data-mode="html-before">HTML ::before (fixed)</button>
        </div>
    </div>

    <div class="stack">
        <div class="card">
            <div class="card-title">Foreground Card A</div>
        </div>
        <div class="card alt">
            <div class="card-title">Foreground Card B</div>
        </div>
        <div class="card">
            <div class="card-title">Foreground Card C</div>
        </div>
        <div class="footer-bar">Sticky Footer Bar</div>
    </div>

    <div class="safe-labels" id="safeMetrics">
        Safe area metrics.
    </div>

    <script>
        (function () {
            const html = document.documentElement;
            const body = document.body;
            const buttons = document.querySelectorAll('[data-mode]');
            const label = document.getElementById('safeMetrics');

            function setMode(mode) {
                html.classList.remove('bg-html', 'bg-html-before');
                body.classList.remove('bg-body-before');

                buttons.forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.mode === mode);
                });

                if (mode === 'html') {
                    html.classList.add('bg-html');
                } else if (mode === 'html-before') {
                    html.classList.add('bg-html-before');
                } else {
                    body.classList.add('bg-body-before');
                }
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            function updateMetrics() {
                const styles = getComputedStyle(html);
                const safeTop = styles.getPropertyValue('--safe-top').trim();
                const safeBottom = styles.getPropertyValue('--safe-bottom').trim();
                label.textContent = `safe-area top: ${safeTop} | bottom: ${safeBottom}`;
            }

            updateMetrics();
            window.addEventListener('resize', updateMetrics);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', updateMetrics);
            }

            setMode('body-before');
        })();
    </script>
</body>

</html>
