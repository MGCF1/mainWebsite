<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Milo Cassarino - iOS Developer</title>
    <meta name="description"
        content="iOS developer portfolio for Milo Cassarino featuring recent projects, tools, and contact links.">
    <link rel="canonical" href="https://mgcf1.com/">
    <meta property="og:title" content="Milo Cassarino - iOS Developer">
    <meta property="og:description"
        content="iOS developer portfolio for Milo Cassarino featuring recent projects, tools, and contact links.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mgcf1.com/">
    <meta property="og:image" content="images/PageIcons/Frame%2060.png">
    <meta property="og:image:alt" content="Milo Cassarino iOS Developer site icon">
    <meta property="og:site_name" content="Milo Cassarino">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Milo Cassarino - iOS Developer">
    <meta name="twitter:description"
        content="iOS developer portfolio for Milo Cassarino featuring recent projects, tools, and contact links.">
    <meta name="twitter:image" content="images/PageIcons/Frame%2060.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/PageIcons/Frame%2060.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/PageIcons/Frame%2060-1.png">
    <link rel="apple-touch-icon" href="images/PageIcons/Frame%2060.png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- Animated App Grid Background — back layer (behind hero) -->
    <div class="app-grid-background app-grid-back" id="appGridBack" aria-hidden="true">
        <div class="scroll-fade-overlay" id="scrollFadeOverlayBack" aria-hidden="true"></div>
    </div>
    <!-- Animated App Grid Background — front layer (in front of hero) -->
    <div class="app-grid-background app-grid-front" id="appGridFront" aria-hidden="true">
        <div class="scroll-fade-overlay" id="scrollFadeOverlayFront" aria-hidden="true"></div>
    </div>

    <!-- Navigation -->
    <header class="site-header">
        <nav class="nav" aria-label="Primary">
            <div class="nav-content">
                <a href="index.html" class="nav-logo">Milo Cassarino</a>
                <div class="nav-links">
                    <a href="#projects">Projects</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <!-- Hero Section with Animated Background -->
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-content" id="heroContent">
                <h1 class="hero-title" id="hero-title"><span class="hero-title-first">Milo</span><br><span
                        class="hero-title-last">Cassarino</span></h1>
                <div class="hero-actions">
                    <span class="hero-badge">iOS Developer</span>
                    <a href="#projects" class="hero-cta">More</a>
                </div>
            </div>
        </section>

        <!-- Recent Highlights -->
        <section id="projects" class="section section-highlights" aria-labelledby="projects-title">
            <div class="section-inner">
                <h2 class="section-title" id="projects-title">Recent Highlights</h2>
            </div>
            <div class="horizontal-scroll highlights-scroll">
                <!-- Cards generated by highlights.js from highlights-data.js -->
            </div>
        </section>

        <!-- Skills -->
        <section class="section section-skills" aria-labelledby="skills-title">
            <div class="section-inner">
                <h2 class="section-title" id="skills-title">Skills</h2>

                <!-- Desktop: two panels side by side — a fixed-width capsule column
                     (leading edge) and an image panel filling the rest, tags now live
                     with the image, not inside the expanding capsule. Mobile keeps the
                     original overlay model: a shared background image with a bottom
                     pill row that expands a floating card. -->
                <div class="skills-stack" id="skillsStack">
                    <div class="skills-accordion-column">
                        <div class="skills-accordion-nav-wrap" id="skillsAccordionNavWrap">
                            <button type="button" class="skills-accordion-nav skills-accordion-nav-up" id="skillsAccordionUp" aria-label="Previous skill">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>
                            </button>
                            <button type="button" class="skills-accordion-nav skills-accordion-nav-down" id="skillsAccordionDown" aria-label="Next skill">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                        </div>
                        <div class="skills-accordion" id="skillsAccordion">
                            <!-- .skills-accordion-item generated by skills.js -->
                        </div>
                    </div>
                    <button type="button" class="skills-accordion-close" id="skillsAccordionClose" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                    </button>

                    <!-- Desktop-only image panel — its own card. Media sizes to
                         background-size: contain so a transparent-background image
                         sits inset on the card rather than being cropped edge to edge.
                         display: contents on mobile (see CSS) so #skillsMedia behaves
                         exactly as it did before this element existed. -->
                    <div class="skills-image-panel">
                        <div class="skills-media" id="skillsMedia" aria-hidden="true">
                            <div class="skills-media-layer is-visible" data-layer="a"></div>
                            <div class="skills-media-layer" data-layer="b"></div>
                            <div class="skills-scrim" aria-hidden="true"></div>
                        </div>
                        <div class="skills-tags skills-image-tags" id="skillsImageTags"></div>
                    </div>

                    <!-- Mobile: bottom pill row + floating card -->
                    <div class="skills-pillrow" id="skillsPillrow">
                        <!-- .skills-pill buttons generated by skills.js -->
                    </div>
                    <button type="button" class="skills-card-nav skills-card-nav-prev" id="skillsPrev" aria-label="Previous skill">&lsaquo;</button>
                    <button type="button" class="skills-card-nav skills-card-nav-next" id="skillsNext" aria-label="Next skill">&rsaquo;</button>
                    <div class="skills-card" id="skillsCard" aria-hidden="true">
                        <div class="skills-card-inner">
                            <button type="button" class="skills-card-close" id="skillsClose" aria-label="Close">&times;</button>
                            <div class="skills-card-content" id="skillsCardContent" aria-live="polite">
                                <h3 class="skills-card-title" id="skillsTitle"></h3>
                                <p class="skills-overview" id="skillsOverview"></p>
                                <div class="skills-tags" id="skillsTags"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- About Me -->
        <section id="about" class="section section-about" aria-labelledby="about-title">
            <div class="section-inner">
                <h2 class="section-title" id="about-title">About Me</h2>
            </div>
            <div class="horizontal-scroll about-scroll">
                <div class="scroll-spacer" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <!-- Connect -->
    <footer id="contact" class="section section-connect" aria-labelledby="contact-title">
        <div class="section-inner">
            <h2 class="section-title" id="contact-title">Let's Connect</h2>
            <div class="phone-frame">
                <img src="images/Phone/PhoneBezel.png" alt="" class="phone-bezel" aria-hidden="true" loading="lazy" decoding="async">
                <div class="phone-screen-container">
                    <img src="images/Phone/PhoneScreen.png" alt="" class="phone-screen-image" aria-hidden="true" loading="lazy" decoding="async">
                    <div class="phone-icons-grid">
                        <!-- Icons generated by connect.js from connect-data.js -->
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="data/projects.js"></script>
    <script src="js/app-grid.js"></script>
    <script src="data/skills-data.js"></script>
    <script src="js/skills.js"></script>
    <script src="data/highlights-data.js"></script>
    <script src="js/highlights.js"></script>
    <script src="data/connect-data.js"></script>
    <script src="js/connect.js"></script>
    <script src="data/about-data.js"></script>
    <script src="js/about.js"></script>
</body>

</html>
